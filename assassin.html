<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="A top-down stealth assassin game with vision cones, patrols and touch controls.">
<title>NIGHTFALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #0b0d12;
    --ink:    #dfe4f0;
    --dim:    #6b7286;
    --blood:  #ff3b47;
    --gold:   #ffc247;
    --calm:   #4be0a8;
    --alert:  #ff8a3d;
    --font:   "Press Start 2P", "Courier New", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* -------------------------------- HUD -------------------------------- */
  #hud {
    position: absolute;
    inset: 0 0 auto 0;
    padding: max(9px, env(safe-area-inset-top)) 56px 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
    font-size: clamp(7px, 2vw, 10px);
    letter-spacing: 1px;
    text-shadow: 0 2px 0 #000;
  }
  #hud.hide { display: none; }
  #hud .col { display: flex; flex-direction: column; gap: 7px; }
  #hud .marks { color: var(--blood); letter-spacing: 3px; }
  #alertTag { color: var(--calm); }
  #alertTag.susp { color: var(--gold); }
  #alertTag.hunt { color: var(--blood); }

  #menuBtn {
    position: absolute;
    top: max(9px, env(safe-area-inset-top));
    right: 10px;
    z-index: 15;
    width: 38px; height: 38px;
    padding: 0;
    font: inherit; font-size: 13px;
    color: var(--ink);
    background: rgba(0, 0, 0, .5);
    border: 2px solid rgba(255, 255, 255, .25);
    cursor: pointer;
    touch-action: none;
  }
  #menuBtn.hide { display: none; }

  /* ------------------------------ Screens ------------------------------ */
  .screen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(9px, 2.4vh, 20px);
    padding: 20px;
    text-align: center;
    background: rgba(8, 10, 15, .94);
    overflow-y: auto;
  }
  .screen[hidden] { display: none; }

  h1 {
    margin: 0;
    font-size: clamp(17px, 6vw, 34px);
    letter-spacing: 3px;
    color: var(--ink);
    text-shadow: 0 0 18px rgba(255, 59, 71, .5);
  }
  h1 span { color: var(--blood); }
  h2 { margin: 0; font-size: clamp(12px, 4.4vw, 21px); }
  p  { margin: 0; font-size: clamp(7px, 2.2vw, 11px); line-height: 2.1; color: var(--dim); }
  .tip { color: var(--ink); }
  .fine { font-size: clamp(6px, 1.8vw, 8px); line-height: 2.2; }

  #missions { display: flex; flex-direction: column; gap: 9px; width: min(440px, 100%); }
  .card {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 13px;
    border: 2px solid #2b3346;
    background: linear-gradient(90deg, rgba(255, 255, 255, .05), transparent);
    color: var(--ink);
    font: inherit;
    font-size: clamp(8px, 2.3vw, 11px);
    text-align: left;
    cursor: pointer;
  }
  .card:active { transform: translateY(2px); }
  .card:focus-visible { outline: 2px dashed var(--gold); outline-offset: 3px; }
  .card .num {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 2px solid var(--blood);
    color: var(--blood);
  }
  .card .meta { display: flex; flex-direction: column; gap: 6px; }
  .card .sub { font-size: clamp(6px, 1.8vw, 8px); color: var(--dim); }
  .card .done { color: var(--calm); font-size: clamp(7px, 2vw, 10px); }

  button.btn {
    font: inherit;
    font-size: clamp(8px, 2.5vw, 11px);
    letter-spacing: 1px;
    color: #0a0a0e;
    background: var(--blood);
    border: none;
    padding: 13px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 #8c1f27;
  }
  button.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c1f27; }
  button.btn.alt { color: var(--ink); background: transparent; border: 2px solid #2b3346; box-shadow: none; }
  button.btn:focus-visible { outline: 2px dashed var(--gold); outline-offset: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  /* ------------------------------ Controls ----------------------------- */
  #act {
    position: absolute;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    z-index: 12;
    width: clamp(72px, 21vw, 104px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: inherit;
    font-size: clamp(7px, 2vw, 9px);
    letter-spacing: 1px;
    color: var(--dim);
    background: rgba(255, 255, 255, .05);
    border: 2px solid #2b3346;
    cursor: pointer;
    touch-action: none;
    transition: color .1s, border-color .1s, background .1s;
  }
  #act.ready {
    color: #14060a;
    background: var(--blood);
    border-color: #ff6b74;
    box-shadow: 0 0 26px rgba(255, 59, 71, .55);
  }
  #act.hide { display: none; }
  #act:active { transform: scale(.94); }

  @media (prefers-reduced-motion: reduce) { #act { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hide">
    <div class="col">
      <span id="hudName">—</span>
      <span id="alertTag">CALM</span>
    </div>
    <div class="col" style="text-align:right">
      <span>MARKS <span class="marks" id="hudMarks">••</span></span>
      <span id="hudHint" style="color:var(--dim)">—</span>
    </div>
  </div>

  <button id="menuBtn" class="hide" type="button" aria-label="Menu">||</button>
  <button id="act" class="hide" type="button">MOVE</button>

  <!-- Mission select -->
  <div class="screen" id="menuScreen">
    <h1>NIGHT<span>FALL</span></h1>
    <p>WALK THE DARK. TAKE THE MARKS.<br>LEAVE BY THE GREEN DOOR.</p>
    <div id="missions"></div>
    <p class="fine">DRAG ANYWHERE TO MOVE &middot; NUDGE = SNEAK &middot; PUSH = RUN<br>
       STRIKE ONLY FROM BEHIND &middot; RUNNING IS LOUD<br>
       TAP WITH A SECOND FINGER TO STRIKE</p>
  </div>

  <!-- Briefing -->
  <div class="screen" id="briefScreen" hidden>
    <h2 id="briefName">—</h2>
    <p id="briefText">—</p>
    <div class="row">
      <button class="btn" id="goBtn" type="button">BEGIN</button>
      <button class="btn alt" id="briefBackBtn" type="button">BACK</button>
    </div>
  </div>

  <!-- Paused -->
  <div class="screen" id="pauseScreen" hidden>
    <h2>HOLD</h2>
    <p id="pauseInfo">—</p>
    <div class="row">
      <button class="btn" id="resumeBtn" type="button">RESUME</button>
      <button class="btn alt" id="retryBtn" type="button">RESTART</button>
      <button class="btn alt" id="quitBtn" type="button">MISSIONS</button>
    </div>
  </div>

  <!-- Failed -->
  <div class="screen" id="failScreen" hidden>
    <h2 style="color:var(--blood)">MISSION FAILED</h2>
    <p id="failText">—</p>
    <div class="row">
      <button class="btn" id="againBtn" type="button">TRY AGAIN</button>
      <button class="btn alt" id="failMenuBtn" type="button">MISSIONS</button>
    </div>
  </div>

  <!-- Cleared -->
  <div class="screen" id="winScreen" hidden>
    <h2 style="color:var(--calm)">EXTRACTED</h2>
    <p id="winText">—</p>
    <div class="row">
      <button class="btn" id="nextBtn" type="button">NEXT CONTRACT</button>
      <button class="btn alt" id="replayBtn" type="button">REPLAY</button>
      <button class="btn alt" id="winMenuBtn" type="button">MISSIONS</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ===================================================================
  // Tuning. Distances are tiles, speeds tiles/second, angles radians.
  //
  // The one number that shapes the whole game: a hunting guard moves at
  // 2.9 and a sprinting player at 3.5. Being seen is bad but not the end —
  // you can break away, which is what makes a mistake interesting instead
  // of just a restart.
  // ===================================================================
  const RUN        = 3.5;
  const GUARD_WALK = 1.15;
  const GUARD_LOOK = 1.75;   // moving to investigate
  const GUARD_HUNT = 2.9;
  const TURN_RATE  = 5.2;    // radians/sec a guard can swing its head

  const BODY_R     = 0.3;    // everyone is the same size
  const CATCH      = 0.62;   // a hunting guard this close ends the run
  const STRIKE     = 0.95;   // reach of a takedown
  const STRIKE_DOT = 0.15;   // how far "behind" behind has to be

  const SILENT     = 0.55;   // stick magnitude that still makes no sound
  const SEE_NEAR   = 1.9;    // full-speed detection inside this range
  const BUSH_SEE   = 1.6;    // in cover you are invisible past this
  const NOISE_RUN  = 4.2;    // a sprint carries this far
  const NOISE_WALK = 1.2;

  const SUSPECT_AT = 0.42;   // awareness thresholds
  const CAUGHT_AT  = 1.0;
  const FORGET     = 0.34;   // awareness bleeds off this fast per second

  const DT = 1 / 60;         // fixed logic step; the AI is deterministic so
                             // a headless bot can replay missions exactly

  const STATE = { PATROL: "patrol", SUSPECT: "suspect", HUNT: "hunt", DEAD: "dead" };

  // ===================================================================
  // Missions
  //
  //   #  wall      .  floor     ,  cover (hides you past 1.6 tiles)
  //   P  start     X  extraction
  //
  // Guards are listed separately so their patrol routes stay readable.
  // `mark: true` makes a guard a contract target; the rest are obstacles
  // you are free to ignore, or not.
  // ===================================================================
  const MISSIONS = [
    {
      name: "THE COURTYARD",
      brief: "ONE MARK. TWO PATROLS.<br>LEARN THE RHYTHM, THEN WALK IN.",
      grid: [
        "##################",
        "#........#.......#",
        "#..,,....#...,,..#",
        "#..,,....#...,,..#",
        "#........#.......#",
        "#....#####.......#",
        "#....#.....#######",
        "#....#....#......#",
        "P....#....#...,,.#",
        "#....#....#...,,.#",
        "#.........#......#",
        "#..,,.....#......#",
        "#..,,.........X..#",
        "##################",
      ],
      guards: [
        { at: [12, 2], path: [[12, 2], [16, 2], [16, 4], [12, 4]], mark: true, fov: 62, range: 6.5 },
        { at: [6, 8],  path: [[6, 8], [6, 12], [9, 12], [9, 8]],   fov: 62, range: 6.0 },
      ],
    },
    {
      name: "THE GALLERY",
      brief: "TWO MARKS BEHIND THE HALLS.<br>THE LONG ROOM IS WATCHED FROM BOTH ENDS.",
      grid: [
        "####################",
        "#P.......#.........#",
        "#.,,.....#..,,,....#",
        "#.,,.....#..,,,....#",
        "#........#.........#",
        "#..#######....######",
        "#..#..........#....#",
        "#..#..######..#....#",
        "#.....#....#..#..,,#",
        "#######....#.....,,#",
        "#..........#.......#",
        "#..,,,..####.#######",
        "#..,,,..#......X...#",
        "#.......#..........#",
        "####################",
      ],
      guards: [
        { at: [14, 2],  path: [[14, 2], [18, 2], [18, 4], [14, 4]],  mark: true, fov: 60, range: 6.5 },
        { at: [16, 12], path: [[16, 12], [10, 12], [10, 13], [16, 13]], mark: true, fov: 60, range: 6.5 },
        { at: [4, 6],   path: [[4, 6], [4, 8], [1, 8], [1, 6]],      fov: 66, range: 6.0 },
        { at: [10, 10], path: [[10, 10], [1, 10], [1, 13], [6, 13]], fov: 66, range: 6.5 },
      ],
    },
    {
      name: "THE VAULT",
      brief: "TWO MARKS, SIX EYES BETWEEN THEM.<br>NOTHING HERE IS UNWATCHED FOR LONG.",
      grid: [
        "####################",
        "#........##........#",
        "#..,,....##....,,..#",
        "#..,,..........,,..#",
        "#........##........#",
        "####..####..####..##",
        "#..........#.......#",
        "#P.,,......#..,,...#",
        "#..,,......#..,,...#",
        "#..........#.......#",
        "##..####..#####..###",
        "#........#.........#",
        "#..,,....#....,,...#",
        "#..,,....#....,,..X#",
        "####################",
      ],
      guards: [
        { at: [15, 2],  path: [[15, 2], [18, 2], [18, 4], [15, 4]],   mark: true, fov: 58, range: 6.5 },
        { at: [14, 12], path: [[14, 12], [10, 12], [10, 13], [14, 13]], mark: true, fov: 58, range: 6.5 },
        { at: [4, 1],   path: [[4, 1], [8, 1], [8, 3], [4, 3]],       fov: 64, range: 6.0 },
        { at: [7, 6],   path: [[7, 6], [7, 9], [1, 9], [1, 6]],       fov: 64, range: 6.5 },
        { at: [16, 7],  path: [[16, 7], [12, 7], [12, 9], [16, 9]],   fov: 64, range: 6.0 },
        { at: [4, 11],  path: [[4, 11], [7, 11], [7, 13], [4, 13]],   fov: 64, range: 6.0 },
      ],
    },
  ];

  // ===================================================================
  // World construction
  // ===================================================================
  const WALL = 1, FLOOR = 0, BUSH = 2;

  function loadMission(m) {
    const h = m.grid.length, w = m.grid[0].length;
    const tiles = new Uint8Array(w * h);
    let start = [1.5, 1.5], exit = [w - 2.5, h - 2.5];

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const c = m.grid[y][x];
        tiles[y * w + x] = c === "#" ? WALL : c === "," ? BUSH : FLOOR;
        if (c === "P") start = [x + 0.5, y + 0.5];
        if (c === "X") exit  = [x + 0.5, y + 0.5];
      }
    }

    const guards = m.guards.map((g, i) => ({
      i,
      x: g.at[0] + 0.5, y: g.at[1] + 0.5,
      ang: 0,
      path: g.path.map(p => [p[0] + 0.5, p[1] + 0.5]),
      wp: 1 % Math.max(1, g.path.length),
      wait: 0,
      mark: !!g.mark,
      fov: (g.fov || 62) * Math.PI / 180,
      range: g.range || 6.5,
      state: STATE.PATROL,
      aware: 0,
      goal: null,        // where it is heading when not patrolling
      hold: 0,           // seconds left of looking around
      route: null,       // cached tile path
      routeAge: 0,
    }));
    // Face the way the route is going, so nobody starts staring at a wall.
    for (const g of guards) {
      const t = g.path[g.wp] || g.path[0];
      g.ang = Math.atan2(t[1] - g.y, t[0] - g.x);
    }

    return {
      w, h, tiles, guards,
      start, exit,
      px: start[0], py: start[1],
      pang: 0, pspeed: 0,
      bodies: [],
      marks: guards.filter(g => g.mark).length,
      status: "run",          // run | fail | win
      reason: "",
      time: 0,
      alarm: 0,               // highest awareness anywhere, for the HUD
    };
  }

  const tileAt = (W, x, y) =>
    (x < 0 || y < 0 || x >= W.w || y >= W.h) ? WALL : W.tiles[(y | 0) * W.w + (x | 0)];
  const isWall = (W, x, y) => tileAt(W, x, y) === WALL;
  const inBush = (W, x, y) => tileAt(W, x, y) === BUSH;

  /** Line of sight between two points, blocked by walls only. */
  function clearLine(W, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    const steps = Math.ceil(Math.hypot(dx, dy) / 0.2);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      if (isWall(W, x0 + dx * t, y0 + dy * t)) return false;
    }
    return true;
  }

  /** Shortest tile path via breadth-first search. Returns tile centres. */
  function findPath(W, sx, sy, gx, gy) {
    const s = (sy | 0) * W.w + (sx | 0), g = (gy | 0) * W.w + (gx | 0);
    if (W.tiles[g] === WALL) return null;
    if (s === g) return [];
    const prev = new Int32Array(W.w * W.h).fill(-1);
    const seen = new Uint8Array(W.w * W.h);
    const q = [s];
    seen[s] = 1;
    for (let head = 0; head < q.length; head++) {
      const c = q[head];
      if (c === g) break;
      const cx = c % W.w, cy = (c / W.w) | 0;
      for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + ox, ny = cy + oy;
        if (nx < 0 || ny < 0 || nx >= W.w || ny >= W.h) continue;
        const n = ny * W.w + nx;
        if (seen[n] || W.tiles[n] === WALL) continue;
        seen[n] = 1; prev[n] = c; q.push(n);
      }
    }
    if (!seen[g]) return null;
    const out = [];
    for (let c = g; c !== s; c = prev[c]) out.push([(c % W.w) + 0.5, ((c / W.w) | 0) + 0.5]);
    return out.reverse();
  }

  // ===================================================================
  // Detection
  // ===================================================================
  /** Can this guard see that point right now? */
  function guardSees(W, g, x, y, hidden) {
    if (g.state === STATE.DEAD) return false;
    const dx = x - g.x, dy = y - g.y;
    const d = Math.hypot(dx, dy);
    if (d > g.range) return false;
    if (hidden && d > BUSH_SEE) return false;      // cover only works at range
    let da = Math.abs(Math.atan2(dy, dx) - g.ang);
    while (da > Math.PI) da = Math.abs(da - 2 * Math.PI);
    if (da > g.fov / 2) return false;
    return clearLine(W, g.x, g.y, x, y);
  }

  function alertNearby(W, g, x, y, radius) {
    for (const o of W.guards) {
      if (o === g || o.state === STATE.DEAD) continue;
      if (Math.hypot(o.x - x, o.y - y) > radius) continue;
      if (o.state !== STATE.HUNT) {
        o.state = STATE.HUNT;
        o.goal = [x, y];
        o.route = null;
        o.hold = 4;
        o.aware = Math.max(o.aware, 0.75);
      }
    }
  }

  // ===================================================================
  // Movement with wall collision. Axis at a time, so sliding along a wall
  // feels right instead of sticking.
  // ===================================================================
  function moveBody(W, o, dx, dy, r) {
    if (dx) {
      const nx = o.x + dx;
      const edge = nx + Math.sign(dx) * r;
      if (!isWall(W, edge, o.y - r * 0.9) && !isWall(W, edge, o.y + r * 0.9)) o.x = nx;
    }
    if (dy) {
      const ny = o.y + dy;
      const edge = ny + Math.sign(dy) * r;
      if (!isWall(W, o.x - r * 0.9, edge) && !isWall(W, o.x + r * 0.9, edge)) o.y = ny;
    }
  }

  function turnToward(g, tx, ty, dt) {
    const want = Math.atan2(ty - g.y, tx - g.x);
    let d = want - g.ang;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    const max = TURN_RATE * dt;
    g.ang += Math.max(-max, Math.min(max, d));
  }

  /** Walk a guard along a cached tile route toward (gx, gy). */
  function advance(W, g, gx, gy, speed, dt) {
    g.routeAge -= dt;
    if (!g.route || !g.route.length || g.routeAge <= 0) {
      g.route = findPath(W, g.x, g.y, gx, gy) || [];
      g.routeAge = 0.5;
    }
    // Skip straight to the goal when nothing is in the way.
    let tx = gx, ty = gy;
    if (g.route.length && !clearLine(W, g.x, g.y, gx, gy)) {
      const next = g.route[0];
      if (Math.hypot(next[0] - g.x, next[1] - g.y) < 0.2) g.route.shift();
      const step = g.route[0] || [gx, gy];
      tx = step[0]; ty = step[1];
    }
    const dx = tx - g.x, dy = ty - g.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) {
      const s = Math.min(speed * dt, d);
      moveBody(W, g, (dx / d) * s, (dy / d) * s, BODY_R);
      turnToward(g, tx, ty, dt);
    }
    return Math.hypot(gx - g.x, gy - g.y);
  }

  // ===================================================================
  // One logic step
  // @param {{mx:number,my:number,act:boolean}} input
  // ===================================================================
  function stepWorld(W, input, dt) {
    if (W.status !== "run") return W;
    W.time += dt;

    // --- player -----------------------------------------------------
    const mag = Math.min(1, Math.hypot(input.mx, input.my));
    if (mag > 0.02) {
      const s = RUN * mag * dt;
      const nx = input.mx / (Math.hypot(input.mx, input.my) || 1);
      const ny = input.my / (Math.hypot(input.mx, input.my) || 1);
      moveBody(W, { get x() { return W.px; }, set x(v) { W.px = v; },
                    get y() { return W.py; }, set y(v) { W.py = v; } },
               nx * s, ny * s, BODY_R);
      W.pang = Math.atan2(ny, nx);
    }
    W.pspeed = mag;

    // Bodies are solid. Without this you can stroll straight through a guard,
    // which looks broken and trivialises every doorway.
    for (const g of W.guards) {
      if (g.state === STATE.DEAD) continue;
      const dx = W.px - g.x, dy = W.py - g.y;
      const d = Math.hypot(dx, dy);
      const min = BODY_R * 2;
      if (d > 0.0001 && d < min) {
        W.px = g.x + (dx / d) * min;
        W.py = g.y + (dy / d) * min;
      }
    }

    const hidden = inBush(W, W.px, W.py);
    const noise = mag > 0.82 ? NOISE_RUN : mag > SILENT ? NOISE_WALK : 0;

    // --- strike -----------------------------------------------------
    if (input.act) {
      const t = strikeTarget(W);
      if (t) {
        t.state = STATE.DEAD;
        t.aware = 0;
        W.bodies.push({ x: t.x, y: t.y, ang: t.ang, seen: false });
        if (t.mark) W.marks--;
        W.lastKill = W.time;
      }
    }

    // --- guards -----------------------------------------------------
    let loudest = 0;
    for (const g of W.guards) {
      if (g.state === STATE.DEAD) continue;

      const sees = guardSees(W, g, W.px, W.py, hidden);
      if (sees) {
        // Closer and faster reads quicker. Standing still in the open is
        // still fatal, just slower.
        const d = Math.hypot(W.px - g.x, W.py - g.y);
        const prox = d < SEE_NEAR ? 1 : 1 - (d - SEE_NEAR) / (g.range - SEE_NEAR) * 0.65;
        g.aware = Math.min(1, g.aware + dt * (0.5 + 1.0 * W.pspeed) * prox);
        g.goal = [W.px, W.py];
        g.route = null;
      } else {
        g.aware = Math.max(0, g.aware - dt * FORGET);
      }

      // Noise draws attention without giving your exact position away.
      if (noise > 0 && g.state === STATE.PATROL) {
        const d = Math.hypot(W.px - g.x, W.py - g.y);
        if (d < noise) {
          g.state = STATE.SUSPECT;
          g.goal = [W.px, W.py];
          g.route = null;
          g.hold = 2.2;
          g.aware = Math.max(g.aware, SUSPECT_AT);
        }
      }

      // A corpse in view is as good as an alarm.
      for (const b of W.bodies) {
        if (b.seen) continue;
        if (guardSees(W, g, b.x, b.y, false)) {
          b.seen = true;
          g.state = STATE.HUNT;
          g.goal = [b.x, b.y];
          g.route = null;
          g.hold = 5;
          g.aware = Math.max(g.aware, 0.8);
          alertNearby(W, g, b.x, b.y, 7);
        }
      }

      if (g.aware >= CAUGHT_AT && g.state !== STATE.HUNT) {
        g.state = STATE.HUNT;
        g.hold = 5;
        alertNearby(W, g, W.px, W.py, 8);
      } else if (g.aware >= SUSPECT_AT && g.state === STATE.PATROL) {
        g.state = STATE.SUSPECT;
        g.goal = [W.px, W.py];
        g.route = null;
        g.hold = 2.4;
      }

      switch (g.state) {
        case STATE.PATROL: {
          if (g.wait > 0) { g.wait -= dt; break; }
          const t = g.path[g.wp];
          if (advance(W, g, t[0], t[1], GUARD_WALK, dt) < 0.18) {
            g.wp = (g.wp + 1) % g.path.length;
            g.wait = 0.7;
            g.route = null;
          }
          break;
        }
        case STATE.SUSPECT: {
          if (g.goal) {
            const left = advance(W, g, g.goal[0], g.goal[1], GUARD_LOOK, dt);
            if (left < 0.3) g.goal = null;
          } else {
            g.ang += TURN_RATE * 0.32 * dt;      // sweep the area
            g.hold -= dt;
            if (g.hold <= 0) { g.state = STATE.PATROL; g.route = null; g.aware = 0.2; }
          }
          break;
        }
        case STATE.HUNT: {
          if (sees) g.hold = 5;
          if (g.goal) {
            const left = advance(W, g, g.goal[0], g.goal[1], GUARD_HUNT, dt);
            if (left < 0.3) g.goal = null;
          } else {
            g.ang += TURN_RATE * 0.45 * dt;
            g.hold -= dt;
            if (g.hold <= 0) { g.state = STATE.SUSPECT; g.hold = 3; g.aware = SUSPECT_AT; }
          }
          if (Math.hypot(W.px - g.x, W.py - g.y) < CATCH) {
            W.status = "fail";
            W.reason = "A GUARD PUT HANDS ON YOU.";
          }
          break;
        }
      }
      loudest = Math.max(loudest, g.aware);
    }
    W.alarm = loudest;

    // --- extraction --------------------------------------------------
    if (W.marks <= 0 && Math.hypot(W.px - W.exit[0], W.py - W.exit[1]) < 0.7) {
      W.status = "win";
    }
    return W;
  }

  /** The guard a strike would land on right now, or null. */
  function strikeTarget(W) {
    let best = null, bestD = STRIKE;
    for (const g of W.guards) {
      if (g.state === STATE.DEAD) continue;
      const dx = W.px - g.x, dy = W.py - g.y;
      const d = Math.hypot(dx, dy);
      if (d > bestD) continue;
      // Behind means the guard's facing and the direction to you disagree.
      const dot = (Math.cos(g.ang) * dx + Math.sin(g.ang) * dy) / (d || 1);
      if (dot > STRIKE_DOT) continue;
      if (!clearLine(W, g.x, g.y, W.px, W.py)) continue;
      best = g; bestD = d;
    }
    return best;
  }

  // ===================================================================
  // Presentation
  // ===================================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const app = document.getElementById("app");
  const hud = document.getElementById("hud");
  const hudName = document.getElementById("hudName");
  const hudMarks = document.getElementById("hudMarks");
  const hudHint = document.getElementById("hudHint");
  const alertTag = document.getElementById("alertTag");
  const actBtn = document.getElementById("act");
  const menuBtn = document.getElementById("menuBtn");
  const missionsBox = document.getElementById("missions");

  const menuScreen  = document.getElementById("menuScreen");
  const briefScreen = document.getElementById("briefScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const failScreen  = document.getElementById("failScreen");
  const winScreen   = document.getElementById("winScreen");

  const CLEARED_KEY = "nightfall-cleared";
  let cleared = {};
  try { cleared = JSON.parse(localStorage.getItem(CLEARED_KEY)) || {}; } catch (_) { cleared = {}; }

  let W = null;
  let mi = 0;
  let mode = "menu";      // menu | brief | play | pause | fail | win
  let acc = 0, last = 0;
  let sparks = [];
  let shake = 0;

  const input = { mx: 0, my: 0, act: false };
  const keys = new Set();

  // --- layout --------------------------------------------------------
  let S = 24, ox = 0, oy = 0;   // tile size in device px, and map origin

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(app.clientWidth * dpr);
    canvas.height = Math.round(app.clientHeight * dpr);
    layout();
  }

  function layout() {
    if (!W) return;
    const portrait = canvas.height > canvas.width * 1.1;
    const top = 52 * (canvas.height / app.clientHeight);
    // In portrait the thumb needs its own space; in landscape the sticks
    // float over the map corners instead.
    const bottom = portrait ? canvas.height * 0.26 : 24;
    const availW = canvas.width - 16;
    const availH = canvas.height - top - bottom;
    S = Math.max(6, Math.min(availW / W.w, availH / W.h));
    ox = (canvas.width - W.w * S) / 2;
    // Portrait sits the map high so the thumb half of the screen stays clear;
    // landscape centres it.
    oy = top + (availH - W.h * S) * (portrait ? 0.12 : 0.5);
  }

  const px = wx => ox + wx * S;
  const py = wy => oy + wy * S;

  function draw() {
    const CW = canvas.width, CH = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#07080c";
    ctx.fillRect(0, 0, CW, CH);
    if (!W) return;

    if (shake > 0) {
      const k = shake * shake * 16;
      ctx.setTransform(1, 0, 0, 1, (Math.random() - .5) * k, (Math.random() - .5) * k);
    }

    // --- floor and walls ---------------------------------------------
    for (let y = 0; y < W.h; y++) {
      for (let x = 0; x < W.w; x++) {
        const t = W.tiles[y * W.w + x];
        const X = px(x), Y = py(y);
        if (t === WALL) {
          ctx.fillStyle = "#1b2131";
          ctx.fillRect(X, Y, S + 1, S + 1);
          ctx.fillStyle = "#252d42";
          ctx.fillRect(X, Y, S + 1, Math.max(1, S * 0.16));
        } else {
          ctx.fillStyle = ((x + y) & 1) ? "#11141c" : "#0e1119";
          ctx.fillRect(X, Y, S + 1, S + 1);
          if (t === BUSH) {
            ctx.fillStyle = "rgba(60,120,88,.55)";
            ctx.fillRect(X + S * .08, Y + S * .08, S * .84, S * .84);
            ctx.fillStyle = "rgba(120,200,150,.22)";
            ctx.fillRect(X + S * .24, Y + S * .24, S * .2, S * .2);
            ctx.fillRect(X + S * .56, Y + S * .5, S * .18, S * .18);
          }
        }
      }
    }

    // --- extraction ---------------------------------------------------
    {
      const live = W.marks <= 0;
      const X = px(W.exit[0]), Y = py(W.exit[1]);
      const pulse = live ? 0.55 + 0.45 * Math.sin(W.time * 5) : 0.22;
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = live ? "#4be0a8" : "#39415a";
      ctx.lineWidth = Math.max(2, S * 0.1);
      ctx.strokeRect(X - S * .38, Y - S * .38, S * .76, S * .76);
      if (live) {
        ctx.globalAlpha = 0.18 + 0.12 * Math.sin(W.time * 5);
        ctx.fillStyle = "#4be0a8";
        ctx.fillRect(X - S * .38, Y - S * .38, S * .76, S * .76);
      }
      ctx.restore();
    }

    // --- vision cones ---------------------------------------------------
    for (const g of W.guards) {
      if (g.state === STATE.DEAD) continue;
      const tint = g.state === STATE.HUNT ? "255,59,71"
                 : g.state === STATE.SUSPECT ? "255,194,71"
                 : "150,170,210";
      const rays = 30;
      ctx.beginPath();
      ctx.moveTo(px(g.x), py(g.y));
      for (let i = 0; i <= rays; i++) {
        const a = g.ang - g.fov / 2 + (g.fov * i) / rays;
        const dxr = Math.cos(a), dyr = Math.sin(a);
        let dist = g.range;
        for (let s = 0.15; s < g.range; s += 0.15) {
          if (isWall(W, g.x + dxr * s, g.y + dyr * s)) { dist = s; break; }
        }
        ctx.lineTo(px(g.x + dxr * dist), py(g.y + dyr * dist));
      }
      ctx.closePath();
      const grd = ctx.createRadialGradient(px(g.x), py(g.y), 0, px(g.x), py(g.y), g.range * S);
      grd.addColorStop(0, "rgba(" + tint + ",.30)");
      grd.addColorStop(1, "rgba(" + tint + ",.03)");
      ctx.fillStyle = grd;
      ctx.fill();
    }

    // --- bodies ----------------------------------------------------------
    for (const b of W.bodies) {
      ctx.save();
      ctx.translate(px(b.x), py(b.y));
      ctx.rotate(b.ang);
      ctx.fillStyle = "rgba(120,30,38,.5)";
      ctx.beginPath(); ctx.ellipse(0, 0, S * .5, S * .34, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#4a2028";
      ctx.fillRect(-S * .3, -S * .18, S * .6, S * .36);
      ctx.restore();
    }

    // --- guards -----------------------------------------------------------
    for (const g of W.guards) {
      if (g.state === STATE.DEAD) continue;
      const col = g.state === STATE.HUNT ? "#ff3b47" : g.state === STATE.SUSPECT ? "#ffc247" : "#93a4c6";
      ctx.save();
      ctx.translate(px(g.x), py(g.y));
      ctx.rotate(g.ang);
      if (g.mark) {
        ctx.strokeStyle = "#ff3b47";
        ctx.lineWidth = Math.max(1.5, S * .07);
        ctx.beginPath(); ctx.arc(0, 0, S * .46, 0, 7); ctx.stroke();
      }
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, S * .3, 0, 7); ctx.fill();
      ctx.fillStyle = "#0a0c12";
      ctx.fillRect(S * .1, -S * .08, S * .24, S * .16);   // nose, shows facing
      ctx.restore();

      if (g.aware > 0.05 && g.state !== STATE.HUNT) {     // awareness pip
        const X = px(g.x), Y = py(g.y) - S * .62;
        ctx.fillStyle = "rgba(0,0,0,.6)";
        ctx.fillRect(X - S * .3, Y - S * .07, S * .6, S * .14);
        ctx.fillStyle = g.aware > 0.75 ? "#ff3b47" : "#ffc247";
        ctx.fillRect(X - S * .3, Y - S * .07, S * .6 * g.aware, S * .14);
      }
      if (g.state === STATE.HUNT) {
        ctx.fillStyle = "#ff3b47";
        ctx.font = "bold " + Math.round(S * .5) + "px " + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = "center";
        ctx.fillText("!", px(g.x), py(g.y) - S * .55);
      }
    }

    // --- player ------------------------------------------------------------
    {
      const inCover = inBush(W, W.px, W.py);
      ctx.save();
      ctx.translate(px(W.px), py(W.py));
      ctx.rotate(W.pang);
      ctx.shadowColor = "#000";
      ctx.shadowBlur = S * .5;
      ctx.fillStyle = inCover ? "#6fd7a5" : "#e7ecf8";
      ctx.beginPath(); ctx.arc(0, 0, S * .3, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#0a0c12";
      ctx.fillRect(S * .1, -S * .07, S * .22, S * .14);
      ctx.restore();

      // Reach ring when a takedown is available.
      if (strikeTarget(W)) {
        ctx.strokeStyle = "rgba(255,59,71,.85)";
        ctx.lineWidth = Math.max(1.5, S * .06);
        ctx.beginPath(); ctx.arc(px(W.px), py(W.py), S * .5 + Math.sin(W.time * 12) * S * .05, 0, 7); ctx.stroke();
      }
    }

    // --- sparks --------------------------------------------------------------
    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, 1 - s.age / s.life);
      ctx.fillStyle = s.c;
      ctx.fillRect(px(s.x) - S * .05, py(s.y) - S * .05, S * .12, S * .12);
    }
    ctx.globalAlpha = 1;

    drawSticks();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ===================================================================
  // Touch stick — springs up wherever the thumb lands
  // ===================================================================
  const stick = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0, r: 60 };

  function drawSticks() {
    if (!stick.on) return;
    const r = stick.r;
    ctx.save();
    ctx.globalAlpha = .5;
    ctx.strokeStyle = "#8fa0c4";
    ctx.lineWidth = Math.max(2, r * .05);
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, r, 0, 7); ctx.stroke();
    ctx.globalAlpha = .18;
    ctx.fillStyle = "#8fa0c4";
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, r, 0, 7); ctx.fill();
    // The knob's distance from the middle is literally your speed, so the
    // ring doubles as a sneak/run gauge.
    ctx.globalAlpha = .85;
    const mag = Math.min(1, Math.hypot(stick.x - stick.ox, stick.y - stick.oy) / r);
    ctx.fillStyle = mag > .75 ? "#ff8a3d" : mag > .35 ? "#ffc247" : "#4be0a8";
    ctx.beginPath(); ctx.arc(stick.x, stick.y, r * .38, 0, 7); ctx.fill();
    ctx.restore();
  }

  const toCanvas = (e) => {
    const rect = canvas.getBoundingClientRect();
    return [(e.clientX - rect.left) * (canvas.width / rect.width),
            (e.clientY - rect.top) * (canvas.height / rect.height)];
  };

  app.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    if (mode !== "play") return;
    e.preventDefault();
    const [x, y] = toCanvas(e);
    // The stick is already someone's thumb. A second finger anywhere on the
    // field is a strike — reaching the button means letting go of the stick,
    // and letting go means standing still.
    if (stick.on) { if (e.pointerId !== stick.id) input.act = true; return; }
    stick.on = true; stick.id = e.pointerId;
    stick.ox = x; stick.oy = y; stick.x = x; stick.y = y;
    stick.r = Math.min(canvas.width, canvas.height) * 0.14;
  });

  window.addEventListener("pointermove", (e) => {
    if (!stick.on || e.pointerId !== stick.id) return;
    const [x, y] = toCanvas(e);
    const dx = x - stick.ox, dy = y - stick.oy;
    const d = Math.hypot(dx, dy);
    const k = d > stick.r ? stick.r / d : 1;
    stick.x = stick.ox + dx * k;
    stick.y = stick.oy + dy * k;
    input.mx = (stick.x - stick.ox) / stick.r;
    input.my = (stick.y - stick.oy) / stick.r;
  });

  function dropStick(e) {
    if (!stick.on || (e && e.pointerId !== stick.id)) return;
    stick.on = false; stick.id = null;
    input.mx = 0; input.my = 0;
  }
  window.addEventListener("pointerup", dropStick);
  window.addEventListener("pointercancel", dropStick);

  // Strike button
  actBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); if (mode === "play") input.act = true; });

  // ===================================================================
  // Keyboard
  // ===================================================================
  const KEYMAP = { w: [0, -1], a: [-1, 0], s: [0, 1], d: [1, 0],
                   ArrowUp: [0, -1], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowRight: [1, 0] };

  window.addEventListener("keydown", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYMAP[k]) { keys.add(k); e.preventDefault(); return; }
    if (k === " " || k === "e" || k === "j") {
      e.preventDefault();
      if (mode === "play") input.act = true;
      else if (mode === "brief") begin();
      return;
    }
    if (k === "Escape" || k === "p") { mode === "play" ? pause() : mode === "pause" ? resume() : 0; }
    if (k === "r" && (mode === "play" || mode === "pause" || mode === "fail")) begin();
    if (k === "Shift") keys.add("Shift");
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys.delete(k);
  });

  function readKeys() {
    if (stick.on) return;                   // touch wins while it is held
    let x = 0, y = 0;
    for (const k of keys) { const v = KEYMAP[k]; if (v) { x += v[0]; y += v[1]; } }
    const d = Math.hypot(x, y);
    if (d > 0) { x /= d; y /= d; }
    const slow = keys.has("Shift") ? 0.42 : 1;
    input.mx = x * slow;
    input.my = y * slow;
  }

  // ===================================================================
  // Flow
  // ===================================================================
  function paintMenu() {
    missionsBox.innerHTML = "";
    MISSIONS.forEach((m, i) => {
      const marks = m.guards.filter(g => g.mark).length;
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="meta"><span>' + m.name + '</span><span class="sub">' +
        marks + ' MARK' + (marks > 1 ? 'S' : '') + ' &middot; ' + m.guards.length + ' GUARDS</span></span>' +
        '<span class="done">' + (cleared[i] ? "CLEAR" : "") + '</span>';
      card.addEventListener("click", () => openBrief(i));
      missionsBox.appendChild(card);
    });
  }

  function show(screen) {
    for (const s of [menuScreen, briefScreen, pauseScreen, failScreen, winScreen]) s.hidden = (s !== screen);
    const playing = screen === null;
    hud.classList.toggle("hide", !playing);
    actBtn.classList.toggle("hide", !playing);
    menuBtn.classList.toggle("hide", !playing);
  }

  function openBrief(i) {
    mi = i;
    mode = "brief";
    document.getElementById("briefName").textContent = MISSIONS[i].name;
    document.getElementById("briefText").innerHTML = MISSIONS[i].brief;
    show(briefScreen);
  }

  function begin() {
    W = loadMission(MISSIONS[mi]);
    sparks = []; shake = 0; acc = 0;
    input.mx = input.my = 0; input.act = false;
    stick.on = false; stick.id = null;
    keys.clear();
    layout();
    hudName.textContent = MISSIONS[mi].name;
    mode = "play";
    last = performance.now();
    show(null);
    updateHud();
  }

  function pause() {
    if (mode !== "play") return;
    mode = "pause";
    dropStick();
    document.getElementById("pauseInfo").innerHTML =
      MISSIONS[mi].name + "<br>MARKS LEFT " + W.marks;
    show(pauseScreen);
  }
  function resume() {
    if (mode !== "pause") return;
    mode = "play";
    last = performance.now();
    show(null);
  }
  function toMenu() { mode = "menu"; paintMenu(); show(menuScreen); }

  function updateHud() {
    if (!W) return;
    const total = MISSIONS[mi].guards.filter(g => g.mark).length;
    hudMarks.textContent = "•".repeat(W.marks) + "◦".repeat(total - W.marks);
    const hunting = W.guards.some(g => g.state === STATE.HUNT);
    const susp = W.guards.some(g => g.state === STATE.SUSPECT);
    alertTag.textContent = hunting ? "HUNTED" : susp ? "SEARCHING" : "CALM";
    alertTag.className = hunting ? "hunt" : susp ? "susp" : "";
    hudHint.textContent = W.marks > 0 ? "TAKE THE MARKS" : "GET TO THE EXIT";
    const ready = !!strikeTarget(W);
    actBtn.classList.toggle("ready", ready);
    actBtn.textContent = ready ? "STRIKE" : "—";
  }

  function spark(x, y, n, c) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 7;
      const s = 1 + Math.random() * 4;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, life: .3 + Math.random() * .4, c });
    }
  }

  // ===================================================================
  // Loop
  // ===================================================================
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.25);
    last = now;

    if (mode === "play" && W) {
      readKeys();
      acc += dt;
      let guard = 8;
      while (acc >= DT && guard-- > 0) {
        acc -= DT;
        const before = W.bodies.length;
        stepWorld(W, input, DT);
        input.act = false;                       // strike is edge-triggered
        if (W.bodies.length > before) {
          const b = W.bodies[W.bodies.length - 1];
          spark(b.x, b.y, 14, "#ff3b47");
          shake = 0.35;
        }
        if (W.status !== "run") break;
      }
      updateHud();

      if (W.status === "fail") {
        mode = "fail";
        shake = 0.6;
        document.getElementById("failText").innerHTML =
          W.reason + "<br>MARKS LEFT " + W.marks;
        show(failScreen);
      } else if (W.status === "win") {
        mode = "win";
        cleared[mi] = true;
        try { localStorage.setItem(CLEARED_KEY, JSON.stringify(cleared)); } catch (_) {}
        const silent = W.bodies.every(b => !b.seen) && W.guards.every(g => g.state !== STATE.HUNT);
        document.getElementById("winText").innerHTML =
          MISSIONS[mi].name + "<br>TIME " + W.time.toFixed(1) + "S<br>" +
          (silent ? '<span style="color:var(--calm)">NOBODY EVER KNEW</span>' : "THEY KNOW SOMEONE CAME");
        show(winScreen);
      }
    }

    for (const s of sparks) { s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .92; s.vy *= .92; }
    sparks = sparks.filter(s => s.age < s.life);
    if (shake > 0) shake = Math.max(0, shake - dt * 2);

    draw();
    requestAnimationFrame(frame);
  }

  // ===================================================================
  // Wiring
  // ===================================================================
  document.getElementById("goBtn").addEventListener("click", begin);
  document.getElementById("briefBackBtn").addEventListener("click", toMenu);
  document.getElementById("resumeBtn").addEventListener("click", resume);
  document.getElementById("retryBtn").addEventListener("click", begin);
  document.getElementById("quitBtn").addEventListener("click", toMenu);
  document.getElementById("againBtn").addEventListener("click", begin);
  document.getElementById("failMenuBtn").addEventListener("click", toMenu);
  document.getElementById("replayBtn").addEventListener("click", begin);
  document.getElementById("winMenuBtn").addEventListener("click", toMenu);
  document.getElementById("nextBtn").addEventListener("click", () => openBrief((mi + 1) % MISSIONS.length));
  menuBtn.addEventListener("click", pause);

  document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "play") pause(); });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("dblclick", (e) => e.preventDefault());
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  // Headless hook: the simulation is deterministic, so a bot can play the
  // missions and prove they can actually be completed.
  window.AssassinDebug = {
    MISSIONS, loadMission, stepWorld, strikeTarget, findPath, guardSees, clearLine, inBush, isWall, STATE, DT,
    open: (i) => { W = loadMission(MISSIONS[i]); mi = i; layout(); return W; },
    get world() { return W; },
    get mode() { return mode; },
    play: (i) => { mi = i; begin(); },
  };

  paintMenu();
  show(menuScreen);
  resize();
  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
